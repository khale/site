{{- /*
  Lab page layout (front matter `layout: hexsa`).
  Same as Wowchemy's _default/single.html, minus the page_header title block:
  the {{< hexsa-hero >}} banner at the top of the content is the page heading.
*/ -}}
{{- define "main" -}}

<article class="article">

  <div class="article-container">

    <div class="article-style">
      {{ .Content }}
    </div>

    {{ partial "page_footer" . }}

  </div>
</article>

{{- end -}}
