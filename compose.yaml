# Local preview/build of the site with the pinned Hugo 0.108.0 toolchain.
#
#   docker compose up --build          # first run; then just: docker compose up
#   open http://localhost:1313/lab/    # live-reloads as you edit
#
#   docker compose run --rm hugo --gc --minify     # one-off production build into ./public
#   docker compose down                            # stop the server
services:
  hugo:
    build: .
    image: halek-site-hugo:0.108.0
    ports:
      - "127.0.0.1:1313:1313"   # only reachable from this machine
    volumes:
      - .:/src
      - hugo-cache:/cache

volumes:
  hugo-cache:
